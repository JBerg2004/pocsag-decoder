# Wird die Version in PocsagDecoder.App.csproj erhöht, baut diese Action beide Exe-Dateien und veröffentlicht
# sie als GitHub-Release (Tag v<Version>). Das Programm sucht dort nach Updates und lädt die passende Exe herunter.
name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/PocsagDecoder.App/PocsagDecoder.App.csproj'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version lesen
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PocsagDecoder.App/PocsagDecoder.App.csproj | head -1)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Release v$version gibt es schon."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.exists != 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Kleine Exe (braucht .NET 8 Desktop Runtime)
        if: steps.version.outputs.exists != 'true'
        run: dotnet publish src/PocsagDecoder.App -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none -o out/klein
      - name: Komplette Exe (mit .NET-Laufzeit)
        if: steps.version.outputs.exists != 'true'
        run: dotnet publish src/PocsagDecoder.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out/komplett
      - name: Release anlegen
        if: steps.version.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir dist
          cp out/klein/PocsagDecoder.exe dist/PocsagDecoder.exe
          cp out/komplett/PocsagDecoder.exe dist/PocsagDecoder-komplett.exe
          cp Installieren.bat dist/
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "POCSAG Decoder ${TAG#v}" --generate-notes
